name: CI

# Manual runs only, to save GitHub Actions minutes.
# Start a run with: gh workflow run CI --ref main
# The local gate (./gradlew check) is the merge gate.
on:
  workflow_dispatch:

jobs:
  build:
    # No custom name: the status check must be called "build" for branch protection.
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android 37 platform
        # sdkmanager 23+ wants "platforms/android-37.0"; older versions want "platforms;android-37.0".
        run: |
          yes | sdkmanager "platforms/android-37.0" || yes | sdkmanager "platforms;android-37.0" || true
          test -f "$ANDROID_HOME/platforms/android-37.0/android.jar"

      - name: Run checks and assemble debug app
        run: ./gradlew check :app:assembleDebug

      - name: Upload test reports on failure
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: test-reports
          path: '**/build/reports/tests/**'
          if-no-files-found: ignore
